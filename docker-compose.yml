services:
  postgres:
    image: postgres:16-alpine
    container_name: uafricas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-africans_db}
      POSTGRES_USER: ${POSTGRES_USER:-uafricas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uafricas_dev_2024}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./uafricas_backend/doc/bd:/docker-entrypoint-initdb.d/bd:ro
      - ./uafricas_backend/doc/bd/docker-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uafricas} -d ${POSTGRES_DB:-africans_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: uafricas_adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    container_name: uafricas_livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_KEYS: "devkey: secret"
    volumes:
      - ./livekit.yaml:/livekit.yaml
    command: --config /livekit.yaml --dev

volumes:
  pgdata:
