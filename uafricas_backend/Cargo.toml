[package]
name = "uafricas_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
actix-multipart = "0.7"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "full"] }
env_logger = "0.11"
log = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "bigdecimal"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
sanitize-filename = "0.6"
futures-util = "0.3"
percent-encoding = "2"
bcrypt = "0.16"
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
livekit-api = "0.4"
livekit-protocol = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
